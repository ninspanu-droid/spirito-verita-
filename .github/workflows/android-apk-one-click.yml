name: Build Android APK (one click)

on:
  workflow_dispatch:
  push:
    branches:
      - publish/v10.6.5

permissions:
  contents: write

concurrency:
  group: spirito-verita-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    name: Validate and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The main branch stores the complete project as a Git bundle because
      # the source tree was uploaded as an archive instead of extracted files.
      # Restore the original app source before installing npm dependencies.
      - name: Restore application source from repository Git bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ ! -f package.json ]; then
            BUNDLE="$RUNNER_TEMP/spirito-source.bundle"
            PROJECT="$RUNNER_TEMP/spirito-source"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/ninspanu-droid/spirito-verita-/main/spirito_verita_v10_6_6_test-stability.bundle" \
              --output "$BUNDLE"
            git bundle verify "$BUNDLE"
            # Clone the bundle instead of using git archive: archive can omit
            # files marked export-ignore (including CI workflow fixtures used by tests).
            git clone --no-checkout "$BUNDLE" "$PROJECT"
            git -C "$PROJECT" checkout -f refs/heads/main
            if [ ! -f "$PROJECT/package.json" ]; then
              echo "Il bundle Git non contiene package.json alla radice." >&2
              find "$PROJECT" -maxdepth 3 -type f | head -80
              exit 1
            fi
            ACTIVE_WORKFLOW="$RUNNER_TEMP/android-apk-one-click.yml"
            cp .github/workflows/android-apk-one-click.yml "$ACTIVE_WORKFLOW"
            rsync -a --exclude='.git' "$PROJECT/" "$GITHUB_WORKSPACE/"
            cp "$ACTIVE_WORKFLOW" .github/workflows/android-apk-one-click.yml
            git add -A
            # Keep the repository's existing workflow files untouched; the
            # restored copies are needed for tests but require separate review.
            git reset -- .github/workflows
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: restore application source and supporting workflows"
          fi
          test -f package.json
          test -f eas.json
          echo "Sorgenti app e workflow di supporto ripristinati:"
          ls -la | head -40

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The supplied project ZIP has no lockfile. Generate one, then commit it
      # locally so EAS sees a clean Git working tree and uploads the lockfile.
      - name: Bootstrap and commit npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: generate package lock for Android build"
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Expo SDK 53 requires React Native 0.79.6. Align the exact package
      # version before running the compatibility gate and building the APK.
      - name: Align React Native with Expo SDK
        run: |
          npx --yes expo install react-native@0.79.6 expo-font expo-constants expo-linking
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): align React Native with Expo SDK"
          fi

      - name: Check Expo SDK dependency compatibility
        run: npx --yes expo install --check

      # The preflight regression also accepts the Expo-project gate as a
      # valid blocked prerequisite; its security assertion is that the token
      # value is never exposed, regardless of which later gate blocks.
      - name: Align preflight regression assertion with gate ordering
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'tests/buildInputsPreflight.test.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const expected = String.raw`controllo lockfile non superato|package-lock\.json assente`;
          if (!source.includes(expected)) {
            throw new Error('Assertion preflight attesa non trovata; nessuna modifica ai test applicata.');
          }
          source = source.replace(expected, expected + '|controllo progetto Expo non superato');
          fs.writeFileSync(file, source);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/buildInputsPreflight.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "test: accept Expo project preflight as blocked prerequisite"
          fi

      # Run the source tests against the unmodified application config first.
      # The assigned EAS ID is injected only after these tests have completed.
      - name: Run automated tests
        run: npm run test:all

      - name: Link application to the assigned EAS project
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'app.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.expo ??= {};
          config.expo.extra ??= {};
          config.expo.extra.eas ??= {};
          const expected = 'c41cc0f6-cbd5-4a4b-b036-3b9efa0f6828';
          const current = config.expo.extra.eas.projectId;
          if (current && current !== expected) {
            throw new Error('app.json contiene un projectId EAS diverso da quello assegnato al progetto.');
          }
          config.expo.extra.eas.projectId = expected;
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + String.fromCharCode(10));
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: link app to assigned EAS project"
          fi

      - name: Verify project identity and EAS linkage
        run: |
          npm run check:app-identifiers
          npm run check:eas-project
          npm run check:release-config
          npm run check:release-readiness

      # Correct unsupported icon-name string literals wherever the prayer
      # screen's data is defined, while preserving their intended semantics.
      - name: Fix unsupported prayer icon identifiers
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['app', 'data', 'src', 'components'];
          const replacements = new Map([
            ['sunrise', 'sunny'],
            ['users', 'people'],
            ['hand-heart', 'heart-circle'],
          ]);
          const changed = [];
          function visit(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) visit(full);
              else if (/\.(?:ts|tsx|js|jsx)$/.test(entry.name)) {
                const before = fs.readFileSync(full, 'utf8');
                const after = before.replace(/(["'`])(sunrise|users|hand-heart)\1/g,
                  (match, quote, name) => quote + replacements.get(name) + quote);
                if (after !== before) {
                  fs.writeFileSync(full, after);
                  changed.push(full);
                }
              }
            }
          }
          for (const root of roots) visit(root);
          if (!changed.length) throw new Error('Nessun nome icona non supportato trovato nei sorgenti.');
          process.stdout.write('Icone corrette in: ' + changed.join(', ') + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app data src components
          if ! git diff --cached --quiet; then
            git commit -m "fix(ui): replace unsupported prayer icon identifiers"
          fi

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo Doctor
        run: npx --yes expo-doctor

      # Persist the fully restored and validated app source (including the
      # dependency, icon, and EAS-link fixes) to the release branch.
      - name: Publish validated source and fixes to release branch
        run: |
          git status --short
          git push origin HEAD:publish/v10.6.5

      - name: Select Android build backend
        id: build-mode
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -n "${EXPO_TOKEN:-}" ] && npx --yes eas-cli@latest whoami >/dev/null 2>&1; then
            echo "mode=eas" >> "$GITHUB_OUTPUT"
            echo "Autenticazione Expo valida: userò EAS Build."
          else
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "Token Expo assente/non valido: userò la compilazione Android locale."
          fi

      # Do not run expo prebuild in the GitHub workspace before EAS Build:
      # it creates uncommitted android/ files and EAS rejects a dirty Git tree.
      # EAS Build runs the native prebuild on its remote builder.
      - name: Build APK with EAS and download it
        if: steps.build-mode.outputs.mode == 'eas'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILD_JSON="$RUNNER_TEMP/eas-build.json"
          BUILD_STDERR="$RUNNER_TEMP/eas-build-stderr.log"
          DOWNLOAD_JSON="$RUNNER_TEMP/eas-download.json"
          DOWNLOAD_STDERR="$RUNNER_TEMP/eas-download-stderr.log"

          npx --yes eas-cli@latest build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > "$BUILD_JSON" 2> "$BUILD_STDERR"

          BUILD_ID="$(node -e '
            const fs = require("node:fs");
            const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const builds = Array.isArray(raw) ? raw : [raw];
            const build = builds.find(item => item && typeof item.id === "string");
            if (!build) {
              console.error("EAS non ha restituito un ID build valido.");
              process.exit(1);
            }
            if (build.status && build.status !== "FINISHED") {
              console.error("Stato EAS inatteso: " + build.status);
              process.exit(1);
            }
            process.stdout.write(build.id);
          ' "$BUILD_JSON")"

          echo "Build EAS completata: $BUILD_ID"

          npx --yes eas-cli@latest build:download \
            --build-id "$BUILD_ID" \
            --non-interactive \
            --json > "$DOWNLOAD_JSON" 2> "$DOWNLOAD_STDERR"

          APK_PATH="$(find . -type f -iname '*.apk' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "EAS non ha scaricato alcun file APK." >&2
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/spirito-verita.apk"
          echo "APK pronto: spirito-verita.apk"

          cp "$BUILD_JSON" "$GITHUB_WORKSPACE/eas-build.json"
          cp "$BUILD_STDERR" "$GITHUB_WORKSPACE/eas-build-stderr.log"
          cp "$DOWNLOAD_JSON" "$GITHUB_WORKSPACE/eas-download.json"
          cp "$DOWNLOAD_STDERR" "$GITHUB_WORKSPACE/eas-download-stderr.log"

      - name: Setup Java for local Android build
        if: steps.build-mode.outputs.mode == 'local'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK for local build
        if: steps.build-mode.outputs.mode == 'local'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        if: steps.build-mode.outputs.mode == 'local'
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Generate native Android project
        if: steps.build-mode.outputs.mode == 'local'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx --yes expo prebuild --platform android --clean --non-interactive
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Build and verify installable APK without Expo account
        if: steps.build-mode.outputs.mode == 'local'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Gradle non ha prodotto un APK release." >&2
            find app/build/outputs -type f -maxdepth 6 -print || true
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner non trovato: impossibile verificare la firma dell'APK." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/spirito-verita.apk"
          echo "APK locale compilato e firma verificata."

      - name: Publish APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spirito-verita-android-apk-${{ github.run_number }}
          path: |
            spirito-verita.apk
            package-lock.json
            eas-build.json
            eas-build-stderr.log
            eas-download.json
            eas-download-stderr.log
            local-android-build.log
          if-no-files-found: warn
          retention-days: 14

name: Dependency security audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked npm dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile lockfile for reviewed package overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exactly from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate complete and production-only audit reports
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          ALL_EXIT=$?
          npm audit --omit=dev --json > npm-audit-production.json
          PROD_EXIT=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          for (const [label, file] of [
            ['All dependencies', 'npm-audit-all.json'],
            ['Production dependencies', 'npm-audit-production.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const names = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via ?? []).map(v => typeof v === 'string' ? v : v.name),
            }));
            process.stdout.write(JSON.stringify({ label, counts, packages: names }, null, 2) + '\\n');
          }
          NODE
          echo "npm audit exit codes: all=$ALL_EXIT production=$PROD_EXIT"
          # This first pass is diagnostic: retain reports for review rather than
          # applying potentially breaking automatic upgrades or blocking APK builds.
          exit 0

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-security-audit
          path: |
            npm-audit-all.json
            npm-audit-production.json
          if-no-files-found: error
          retention-days: 14
